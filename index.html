<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestForge AI — Feedback de Testes com IA</title>
<style>
:root{
  --bg:#071318; --bg2:#0b1e26; --panel:#0f2a33; --panel2:#12333d; --line:#1d4b58;
  --txt:#e6f6f7; --mut:#8fb3bb; --teal:#31e0c8; --teal2:#0fb9a3; --amber:#ffc857;
  --red:#ff6b6b; --green:#3ddc84; --violet:#a78bfa; --blue:#4cc9f0; --orange:#ff9f45;
  --r:14px; --sh:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(1200px 700px at 12% -10%,#123b46 0%,transparent 60%),var(--bg);
  color:var(--txt);font:15px/1.55 "Segoe UI",Roboto,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--teal);text-decoration:none}
h1,h2,h3,h4{margin:0 0 .4em;line-height:1.25;font-weight:650}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.hide{display:none!important}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}
.grow{flex:1}.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.card.pad0{padding:0;overflow:hidden}
.stat{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-.5px}
.stat .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--mut)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
  border:1px solid var(--line);background:#0c2630;color:var(--mut);white-space:nowrap}
.b-pass{background:rgba(61,220,132,.14);color:var(--green);border-color:rgba(61,220,132,.4)}
.b-fail{background:rgba(255,107,107,.14);color:var(--red);border-color:rgba(255,107,107,.4)}
.b-partial{background:rgba(255,200,87,.14);color:var(--amber);border-color:rgba(255,200,87,.4)}
.b-blocked{background:rgba(167,139,250,.14);color:var(--violet);border-color:rgba(167,139,250,.4)}
.b-critico{background:rgba(255,107,107,.18);color:var(--red);border-color:rgba(255,107,107,.45)}
.b-alto{background:rgba(255,159,69,.16);color:var(--orange);border-color:rgba(255,159,69,.45)}
.b-medio{background:rgba(255,200,87,.14);color:var(--amber);border-color:rgba(255,200,87,.4)}
.b-baixo{background:rgba(76,201,240,.14);color:var(--blue);border-color:rgba(76,201,240,.4)}
.b-ok{background:rgba(61,220,132,.14);color:var(--green);border-color:rgba(61,220,132,.4)}
.b-no{background:rgba(255,107,107,.14);color:var(--red);border-color:rgba(255,107,107,.4)}
button,.btn{background:linear-gradient(180deg,var(--teal),var(--teal2));color:#04262a;border:0;
  padding:9px 15px;border-radius:10px;font-weight:650;font-size:14px;cursor:pointer;transition:.15s}
button:hover,.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
button:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:#0d2831;color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:linear-gradient(180deg,#ff8080,#e34d4d);color:#2a0505}
.btn.sm2{padding:6px 11px;font-size:12.5px;border-radius:8px}
input,select,textarea{width:100%;background:#081d24;border:1px solid var(--line);color:var(--txt);
  padding:10px 12px;border-radius:10px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(49,224,200,.13)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label{display:block;font-size:12.5px;color:var(--mut);margin:10px 0 4px;letter-spacing:.3px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
th{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.7px}
tbody tr:hover{background:rgba(49,224,200,.04)}
/* Layout */
#app{display:none;min-height:100vh}
#shell{display:grid;grid-template-columns:290px 1fr;min-height:100vh}
@media(max-width:900px){#shell{grid-template-columns:1fr}}
aside{background:linear-gradient(180deg,#0a1f27,#071318);border-right:1px solid var(--line);
  padding:16px;display:flex;flex-direction:column;gap:12px}
main{padding:20px 24px 60px;max-width:1500px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(140deg,var(--teal),#1a7f9c);
  display:grid;place-items:center;color:#04262a;font-weight:800}
.plist{display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;padding-right:4px}
.pitem{padding:9px 11px;border-radius:10px;border:1px solid transparent;cursor:pointer;transition:.12s}
.pitem:hover{background:#0e2a33}
.pitem.on{background:#10333d;border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:14px 0 18px;padding-bottom:0}
.tab{padding:9px 14px;border-radius:9px 9px 0 0;cursor:pointer;color:var(--mut);font-weight:600;font-size:13.5px;
  border:1px solid transparent;border-bottom:0}
.tab:hover{color:var(--txt);background:#0e2a33}
.tab.on{color:var(--teal);background:var(--panel);border-color:var(--line)}
/* Dropzone */
.dz{border:2px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--mut);
  background:#081d24;transition:.15s;cursor:pointer}
.dz.hot{border-color:var(--teal);background:#0d2c34;color:var(--txt);transform:scale(1.005)}
.thumbs{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.thumb{position:relative;width:104px;height:104px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#06161c}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;border-radius:6px;
  width:20px;height:20px;display:grid;place-items:center;font-size:12px;cursor:pointer}
.thumb .nm{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.65);font-size:9.5px;padding:2px 4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Kanban */
.kb{display:grid;gap:12px;grid-template-columns:repeat(5,minmax(190px,1fr));align-items:start;overflow-x:auto;padding-bottom:8px}
@media(max-width:1100px){.kb{grid-template-columns:repeat(5,minmax(220px,1fr))}}
.col{background:#0a2029;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:150px;transition:.15s}
.col.hot{border-color:var(--teal);background:#0d2831}
.col h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);display:flex;justify-content:space-between}
.kcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:10px;
  padding:10px;margin-bottom:9px;cursor:grab;transition:.12s}
.kcard:hover{border-color:var(--teal)}
.kcard.dragging{opacity:.45;transform:rotate(.4deg)}
.kcard .t{font-weight:640;font-size:13.5px;margin-bottom:5px}
.kcard .d{font-size:12px;color:var(--mut);white-space:pre-wrap;max-height:88px;overflow:auto}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
/* Charts */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:8px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px}
.bar{height:9px;border-radius:6px;background:#0d3038;overflow:hidden;margin-top:5px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2))}
.bar.bad>span{background:linear-gradient(90deg,#ff8080,#e34d4d)}
.note{border-left:3px solid var(--teal);background:#0c2831;padding:9px 12px;border-radius:0 9px 9px 0;margin-bottom:8px}
.note.k-fail{border-left-color:var(--red)}.note.k-pass{border-left-color:var(--green)}
.modal{position:fixed;inset:0;background:rgba(3,10,13,.72);display:grid;place-items:center;padding:18px;z-index:50;
  backdrop-filter:blur(3px)}
.modal .card{max-width:880px;width:100%;max-height:88vh;overflow:auto}
.toast{position:fixed;right:18px;bottom:18px;z-index:90;display:flex;flex-direction:column;gap:8px}
.toast div{background:#0f2f39;border:1px solid var(--teal);border-left:4px solid var(--teal);padding:11px 15px;
  border-radius:10px;box-shadow:var(--sh);max-width:400px;font-size:13.5px;animation:sl .25s ease}
.toast div.err{border-color:var(--red);border-left-color:var(--red)}
@keyframes sl{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.spin{width:15px;height:15px;border:2px solid rgba(255,255,255,.25);border-top-color:#04262a;border-radius:50%;
  display:inline-block;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#081d24}
.seg button{background:transparent;color:var(--mut);border-radius:0;padding:6px 11px;font-size:12.5px;transform:none}
.seg button.on{background:var(--teal);color:#04262a}
/* Login */
#login{display:grid;place-items:center;min-height:100vh;padding:20px}
.lbox{width:100%;max-width:440px}
.hero{text-align:center;margin-bottom:16px}
.hero .logo{width:52px;height:52px;border-radius:15px;font-size:22px;margin:0 auto 10px}
code{background:#081d24;border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12.5px}
pre{background:#06161c;border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:12.5px;
  max-height:340px;white-space:pre-wrap}
.ai-msg{background:#0a2630;border:1px solid var(--line);border-left:3px solid var(--violet);padding:10px 13px;
  border-radius:0 10px 10px 0;font-size:13.5px}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="lbox">
    <div class="hero">
      <div class="logo">TF</div>
      <h1>TestForge AI</h1>
      <p class="mut sm">Planejamento de testagem por IA · feedback estruturado · backlog kanban dinâmico</p>
    </div>
    <div class="card">
      <div class="tabs" style="margin-top:0">
        <div class="tab on" id="tbLogin" data-i18n="Entrar">Entrar</div>
        <div class="tab" id="tbReg" data-i18n="Cadastrar">Cadastrar</div>
      </div>
      <div id="paneLogin">
        <label data-i18n="E-mail ou @handle">E-mail ou @handle</label>
        <input id="liEmail" placeholder="admin@testforge.local" autocomplete="username">
        <label data-i18n="Senha">Senha</label>
        <input id="liPass" type="password" placeholder="••••••" autocomplete="current-password">
        <div class="row" style="margin-top:14px">
          <button id="btLogin" class="grow" data-i18n="Entrar">Entrar</button>
          <div class="seg" id="langSegLogin"></div>
        </div>
        <div id="demoBox" class="mut xs" style="margin-top:12px"></div>
      </div>
      <div id="paneReg" class="hide">
        <div class="grid g2">
          <div><label data-i18n="Nome">Nome</label><input id="rgName"></div>
          <div><label data-i18n="@handle (usado nas menções)">@handle (usado nas menções)</label><input id="rgHandle" placeholder="dev.ana"></div>
        </div>
        <label data-i18n="E-mail">E-mail</label><input id="rgEmail" type="email">
        <div class="grid g2">
          <div><label data-i18n="Senha (mín. 5)">Senha (mín. 5)</label><input id="rgPass" type="password"></div>
          <div><label data-i18n="Perfil">Perfil</label>
            <select id="rgRole">
              <option value="solicitante" data-i18n="Dev solicitante">Dev solicitante</option>
              <option value="testador" data-i18n="Dev testador">Dev testador</option>
            </select>
          </div>
        </div>
        <button id="btReg" class="grow" style="margin-top:14px;width:100%" data-i18n="Criar conta">Criar conta</button>
      </div>
    </div>
    <p class="mut xs" style="text-align:center;margin-top:12px">
      <span data-i18n="Chaves de IA ficam apenas no servidor">Chaves de IA ficam apenas no servidor</span> · PHP 8 + SQLite
    </p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div id="shell">
    <aside>
      <div class="row between">
        <div class="brand"><div class="logo">TF</div>TestForge AI</div>
      </div>
      <div class="row between">
        <div class="grow">
          <div class="sm" id="meName">—</div>
          <div class="xs mut" id="meRole">—</div>
        </div>
        <button class="btn ghost sm2" id="btLogout" data-i18n="Sair">Sair</button>
      </div>
      <div class="row between">
        <h3 style="margin:0" data-i18n="Projetos">Projetos</h3>
        <button class="btn sm2" id="btNew" data-i18n="+ Novo">+ Novo</button>
      </div>
      <div class="plist" id="plist"></div>
      <div class="row between" style="border-top:1px solid var(--line);padding-top:10px">
        <div class="seg" id="langSeg"></div>
        <span class="xs mut" id="verTag"></span>
      </div>
    </aside>
    <main id="main"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/app.js"></script>
<script src="assets/views.js"></script>
</body>
</html>
